name: CI

on:
  push:
    branches: [ main, master, ww/latest, present/*, project/* ]
    tags:
      - '**'
  pull_request:
    branches: [ main, master, ww/latest, present/*, project/* ]

jobs:
  test:
    name: Test on julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts' # 1.10
          - '1' # latest stable (1.12)
          - 'pre' # prerelease build (1.13)
          - 'nightly' # dev
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Build Julia packages
        uses: julia-actions/julia-buildpkg@latest
      - name: Run tests
        uses: julia-actions/julia-runtest@latest
