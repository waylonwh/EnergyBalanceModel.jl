name: CI

on:
  push:
    branches: [ main, master, ww/latest ]
  pull_request:
    branches: [ main, master, ww/latest ]

jobs:
  test:
    name: Test on julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts' # 1.10
          - '1' # latest stable (1.12)
          - 'pre' # prerelease build (1.13)
          - 'nightly' # dev
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Build Julia packages
        uses: julia-actions/julia-buildpkg@latest
      - name: Run tests
        uses: julia-actions/julia-runtest@latest

  pr_automation:
    name: PR Automation
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: github.event.pull_request.base.ref == 'ww/latest' && github.event.pull_request.author_association == 'OWNER'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Merge to ww/latest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          gh pr merge --merge --admin "$PR"
      - name: Create draft PR to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          head='${{ github.event.pull_request.head.ref }}'
          title='${{ github.event.pull_request.title }}'
          body='${{ github.event.pull_request.body }}'
          gh pr create --base main --head "$head" --title "$title" --body "$body" --draft
