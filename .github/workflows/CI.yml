name: CI

on:
  push:
    branches: [ main, master, ww/latest ]
  pull_request:
    branches: [ main, master, ww/latest ]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # LTS
          - '1' # latest stable
          - '1.12-nightly' # upcoming stable
          - 'nightly' # dev
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  pr_automation:
    name: PR Automation
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.author_association == 'OWNER'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Merge to ww/latest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          gh pr merge --merge --admin "$PR"
      - name: Create draft PR to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          head='${{ github.event.pull_request.head.ref }}'
          title='${{ github.event.pull_request.title }}'
          body='${{ github.event.pull_request.body }}'
          gh pr create --base main --head "$head" --title "$title" --body "$body" --draft
